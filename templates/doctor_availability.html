<!DOCTYPE html>
<html>
<head>
  <title>Manage Availability | HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <a href="{{ url_for('doctor_dashboard') }}" class="btn btn-secondary mb-3">← Back to Dashboard</a>

  <h3>Update Availability</h3>
  <form method="POST" class="mt-3">
    <div class="mb-3">
      <label class="form-label">Availability (next 7 days)</label>
      <textarea name="availability" class="form-control" rows="3"
                placeholder="e.g., Mon-Fri: 10:00-16:00, Sat: 09:00-13:00">{{ doctor.availability or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save Availability</button>
  </form>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mt-4">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

</body>
</html>
