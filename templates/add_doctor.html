<!DOCTYPE html>
<html>
<head>
  <title>Add Doctor | HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <h3 class="text-center mb-4">Add a New Doctor</h3>

  <form method="POST" class="border p-4 rounded shadow-sm">
    <input type="text" name="name" placeholder="Doctor Name" class="form-control mb-3" required>
    <input type="email" name="email" placeholder="Doctor Email" class="form-control mb-3" required>
    <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>

    <label>Department</label>
    <select name="department" class="form-control mb-3" required>
      {% for dept in departments %}
        <option value="{{ dept.id }}">{{ dept.name }}</option>
      {% endfor %}
    </select>

    <button type="submit" class="btn btn-primary w-100">Add Doctor</button>
  </form>

  <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} mt-3">{{ message }}</div>
    {% endfor %}
  {% endwith %}
</body>
</html>
