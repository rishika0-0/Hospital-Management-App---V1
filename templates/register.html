<!DOCTYPE html>
<html>
<head>
  <title>Patient Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #333892, #487da3);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .login-card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 18px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #6b7280;
    }

    .form-control {
      border-radius: 999px;
      padding: 0.7rem 1rem;
      border: 1px solid #d1d5db;
      font-size: 0.95rem;
    }

    .form-control:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.35);
    }

    .btn-success {
      border-radius: 999px;
      padding: 0.7rem 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #4a90e2);
      border: none;
    }

    .btn-success:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
    }

    .btn-success:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .footer-text {
      font-size: 0.9rem;
      color: #6b7280;
    }

    .footer-text a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    .alert {
      border-radius: 999px;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
  <h2 class="text-center mb-4 login-title">Patient Registration</h2>

  <form method="POST">
    <input type="text" name="name" class="form-control mb-3" placeholder="Full Name" required>
    <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
    <input type="text" name="contact" class="form-control mb-3" placeholder="Contact Number">
    <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
    <button class="btn btn-success w-100">Register</button>
  </form>

  <p class="mt-3 text-center footer-text">
    Already have an account? <a href="{{ url_for('login') }}">Login</a>
  </p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }} mt-3 text-center">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  </div>
</body>
</html>
