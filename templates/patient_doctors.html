<!DOCTYPE html>
<html>
<head>
  <title>Find Doctors | HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

  <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary mb-3">← Back to Dashboard</a>

  <h3>Doctors</h3>

  <form method="get" class="row g-2 mb-3">
    <div class="col-md-8">
      <input type="text" name="q" class="form-control"
             placeholder="Search by name or specialization" value="{{ q or '' }}">
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary w-100">Search</button>
    </div>
  </form>

  <div class="row">
    {% for d in doctors %}
    <div class="col-md-4 mb-3">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ d.name }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ d.department.name if d.department else '' }}</h6>
          <p class="card-text">
            Email: {{ d.email }}<br>
            Availability: {{ d.availability or 'Check slots' }}
          </p>
          <a href="{{ url_for('patient_book_appointment', doctor_id=d.id) }}" class="btn btn-sm btn-primary">
            Book Appointment
          </a>
        </div>
      </div>
    </div>
    {% else %}
    <p class="text-muted">No doctors found.</p>
    {% endfor %}
  </div>

</body>
</html>
